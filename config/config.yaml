input_file: data/grid-puzzles-sample.csv
output_file: data/gflash25/grid-puzzles-sample-py.csv
save_results: true

llm:
  provider: gemini
  model_name: gemini-2.5-flash

llm_verifier_py:
  enable: false

llm_verifier_asp:
  enable: false

llm_direct:
  enable: false

run_llm_verifier:
  type: py
  intermediate_file: data/gflash25/grid-puzzles-sample-verifier(py).csv
  enable: true